<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Literalura - Catálogo</title>

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Vollkorn:wght@400;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <script src="../styles/tailwind.config.js"></script>
  <link href="../styles/global.css" rel="stylesheet" />
  <link href="../styles/variables.css" rel="stylesheet" />
  <link href="../styles/modules/_libro-catalog.css" rel="stylesheet" />
</head>

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md"
  style="background-color: #F7F1E8;">
  <header
    class="flex items-center justify-between whitespace-nowrap border-b border-outline-variant bg-surface-container-lowest px-10 py-6 shrink-0">
    <a href="global-search.html" class="flex items-center gap-4 text-charcoal-text hover:opacity-80 transition-opacity">
      <div class="size-10 rounded-full overflow-hidden border border-outline-variant">
        <img alt="Mascot Logo" class="w-full h-full object-cover" src="../assets/images/portada.png">
      </div>
      <h2 class="text-charcoal-text text-2xl font-bold tracking-[-0.015em]">Literalura</h2>
    </a>
    <div class="flex flex-1 justify-end gap-8">
      <div class="flex items-center gap-9">
        <a class="text-primary text-lg font-medium border-b-2 border-primary pb-1"
          href="libro-catalog.html">Catálogo</a>
        <a class="text-on-surface-variant text-lg font-medium hover:text-primary transition-colors pb-1"
          href="autor-directory.html">Autores</a>
      </div>
    </div>
  </header>

  <div class="flex flex-1 max-w-container-max mx-auto w-full px-8 md:px-16 py-6 gap-10 mt-8">
    <aside
      class="w-[300px] shrink-0 flex flex-col gap-8 bg-surface-container-lowest p-6 rounded-2xl shadow-sm border border-outline-variant h-fit">
      <div>
        <h3 class="text-2xl font-bold text-charcoal-text mb-4">Buscar</h3>
        <div class="relative mb-4">
          <img alt="Search" class="size-6 absolute left-4 top-1/2 -translate-y-1/2 opacity-70"
            src="../assets/icons/lupa.png">
          <input
            class="w-full bg-surface-container-lowest border border-outline-variant rounded-xl pl-12 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent text-lg text-on-surface placeholder:text-outline"
            id="search-input" placeholder="Título o autor..." type="text">
        </div>
        <button
          class="w-full flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-surface-container-lowest text-charcoal-text border border-outline-variant text-lg font-bold hover:bg-surface-container transition-colors shadow-sm"
          id="btn-mostrar-todos">
          <img alt="List All" class="size-6"
            src="https://lh3.googleusercontent.com/aida/AP1WRLub1slq0rK79RnACSy8duvT-CrzcMNbe-m7VMW6PZdlt9aySsB1TNu3Qjv95WtPz0xVczzRKM2X5dWgrdF2c8Y91J_Fj3pswave_dYzNrLJqNUbbeas4DYxQytiZrXHfNm7OYYYCtOnmjQmaDWpoZF1hzWS3u3MkUXPacZmaNFqLAZosE8lHPsD4DWABxlA4pji0JqizBrNZGgqXxnXr4EaZ-uiLDd_E4kF8udKdrrkPhVtzVkjSAYEtGA">
          Mostrar Todos
        </button>
      </div>
      <div>
        <h3 class="text-2xl font-bold text-charcoal-text mb-4">Idioma</h3>
        <div class="flex flex-col gap-3">
          <button
            class="lang-btn w-full text-left px-5 py-3 rounded-xl bg-surface-container-lowest text-on-surface border border-outline-variant text-lg font-bold hover:bg-surface-container transition-colors"
            data-lang="es">Español</button>
          <button
            class="lang-btn w-full text-left px-5 py-3 rounded-xl bg-surface-container-lowest text-on-surface border border-outline-variant text-lg font-bold hover:bg-surface-container transition-colors"
            data-lang="en">Inglés</button>
          <button
            class="lang-btn w-full text-left px-5 py-3 rounded-xl bg-surface-container-lowest text-on-surface border border-outline-variant text-lg font-bold hover:bg-surface-container transition-colors"
            data-lang="pt">Portugués</button>
          <button
            class="lang-btn w-full text-left px-5 py-3 rounded-xl bg-surface-container-lowest text-on-surface border border-outline-variant text-lg font-bold hover:bg-surface-container transition-colors"
            data-lang="ru">Ruso</button>
        </div>
      </div>
    </aside>

    <main class="flex-1">
      <div class="flex justify-between items-end mb-8">
        <h1 class="text-5xl font-bold text-charcoal-text">Tu Colección</h1>
        <button
          class="bg-primary-container text-on-primary px-6 py-3 rounded-full text-lg font-bold shadow-md hover:shadow-lg transition-all flex items-center gap-2 hover:-translate-y-1"
          id="btn-nuevo-hechizo">
          <span class="material-symbols-outlined text-[24px]">add</span>
          Nuevo Libro
        </button>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="books-grid">
      </div>
    </main>
  </div>

  <template id="empty-state-template">
    <div class="col-span-full flex flex-col items-center justify-center py-12 text-center">
      <img alt="Empty state" class="w-64 h-64 object-contain mb-6 mix-blend-multiply"
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuDFx1TzDn_NPbEQJ_lWpcTz0H_-f4mZoslcLrzio6Xedho6L-i-Zkq1sa4ahdLOZtaCy0o2NWGSHsu_U36RdQVQLg6UqcUZdSQlDzy8wo6xHFmddi59swYfQiesv8poD-wMHfRAam-txfgwQt8QEyRMMPnD8-fcRVHfM18LP-XDnFahsqDcTrsTRAgOnWfaTRX1nx472zp-MjMmoF1ZoaKJi17CbQ3JVed4seum4JYrvhw_6mu6TGC7">
      <p class="text-2xl font-bold text-primary" id="empty-state-message">No se encontraron libros...</p>
    </div>
  </template>

  <template id="book-card-template">
    <div
      class="bg-surface-container-lowest rounded-[1.5rem] shadow-[0_4px_16px_rgba(0,0,0,0.06)] hover:shadow-[0_8px_24px_rgba(0,0,0,0.12)] transition-all p-4 flex flex-col gap-4 border border-outline-variant group hover:-translate-y-1">
      <div class="aspect-[4/5] w-full rounded-xl overflow-hidden relative border border-surface-variant">
        <img alt="Libro" class="w-full h-full object-cover cover-img" src="../assets/images/portada.png"
          onerror="this.onerror=null; this.src='../assets/images/portada.png';" />
        <div class="absolute top-3 right-3 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
          <button
            class="btn-edit w-10 h-10 rounded-full bg-surface-container-lowest text-charcoal-text flex items-center justify-center shadow-md hover:text-primary transition-colors"
            data-id="">
            <span class="material-symbols-outlined text-[22px]">edit</span>
          </button>
          <button
            class="btn-delete w-10 h-10 rounded-full bg-surface-container-lowest text-charcoal-text flex items-center justify-center shadow-md hover:text-error transition-colors"
            data-id="">
            <img alt="Delete" class="size-6" src="../assets/icons/tachito.png">
          </button>
        </div>
      </div>
      <div class="px-1 pb-1">
        <h4 class="text-2xl font-bold text-charcoal-text mb-1 truncate title-text"></h4>
        <p class="text-on-surface-variant text-lg font-medium mb-4 author-text"></p>
        <span
          class="inline-block px-4 py-1.5 bg-surface-container rounded-full text-sm font-bold text-on-surface language-badge"></span>
      </div>
    </div>
  </template>

  <div class="fixed inset-0 bg-charcoal-text/50 z-50 flex items-center justify-center hidden" id="success-overlay">
    <div
      class="bg-surface-container-lowest rounded-[2rem] p-8 max-w-sm w-full mx-4 shadow-xl flex flex-col items-center text-center">
      <img alt="Success" class="w-48 h-48 object-contain mb-4"
        src="https://lh3.googleusercontent.com/aida-public/AB6AXuAHxX-pjDZna_8AW2qgt0dMddjePCCz4RrPMj0_ep6smbrFOUSJ2f69pDyfJ72rkH5ueN1m4r4_cBjQQ-zjr2Rxwr-L-1tMRAdJSYXYqACyLUNh9XUbe3NZUH4hlLpLyqux7vtIQm58Y88P5HAEWvq1V0ywuXMnxbxhfvNe89PcSf0E7LCNHL0YTu__7eOiUvDiqhPKKDD99Lzo5CjLWDKCMFMoeC6gnXCoTjW5qRNLhDZj2Ga5iz2B">
      <h3 class="font-headline-lg text-charcoal-text mb-2">¡Éxito!</h3>
      <p class="font-body-md text-on-surface-variant mb-6">Operación completada con éxito.</p>
      <button
        class="bg-primary text-on-primary px-8 py-3 rounded-full font-label-lg w-full hover:bg-primary/90 transition-colors"
        id="btn-close-success">Continuar</button>
    </div>
  </div>

  <script type="module" src="../scripts/pages/libro-catalog.js"></script>
  <script type="module" src="../scripts/main.js"></script>
</body>

</html>
